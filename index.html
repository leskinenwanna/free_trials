<html>
<head>
  <title>Ilmaiset harrastuksien kokeilukerrat Helsingissä</title>
</head>
<body>
  <h1>Ilmaiset kokeilut Helsingissä</h1>
  <p>Tämä lista päivittyy automaattisesti maanantaisin tekoälyn avulla.</p>
  <script>
    fetch('/data/offers.json')
      .then(r => r.json())
      .then(data => {
        const ul = document.createElement('ul');
        data.forEach(o => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${o.name}</strong> – ${o.offer_type} (${o.city_district})`;
          ul.appendChild(li);
        });
        document.body.appendChild(ul);
      });
  </script>
</body>
</html>
