<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kokeile harrastuksia ilmaiseksi Helsingissä</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f7;
        padding: 40px;
        margin: 0;
        color: #333;
      }

      h1 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 10px;
        color: #111;
      }

      p.description {
        text-align: center;
        font-size: 16px;
        color: #555;
        margin-bottom: 30px;
      }

      .category-buttons {
        text-align: center;
        margin-bottom: 40px;
      }

      .category-buttons button {
        background: white;
        border: 1px solid #bbb;
        padding: 10px 20px;
        margin: 6px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
      }

      .category-buttons button:hover {
        background: #e8f3ff;
        border-color: #0077dd;
      }

      .offer-container {
        max-width: 800px;
        margin: auto;
      }

      .offer-card {
        background: white;
        padding: 18px 22px;
        margin-bottom: 18px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        transition: all 0.2s ease;
      }

      .offer-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 14px rgba(0,0,0,0.12);
      }

      .offer-card a {
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        color: #0066cc;
      }

      .offer-card a:hover {
        text-decoration: underline;
      }

      .tag {
        display: inline-block;
        background: #def1ff;
        color: #005a99;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-top: 6px;
      }

      hr {
        margin-top: 50px;
        margin-bottom: 20px;
        border: none;
        border-top: 1px solid #ddd;
      }

      footer {
        text-align: center;
        font-size: 13px;
        color: #777;
      }
    </style>
  </head>

  <body>
    <h1>Kokeile harrastuksia ilmaiseksi Helsingissä</h1>
    <p class="description">
      Tietokanta päivittyy automaattisesti maanantaisin tekoälyn avulla.
    </p>

    <div class="category-buttons" id="categoryButtons"></div>

    <div class="offer-container" id="offers"></div>

    <script>
      let allOffers = [];

      // Uudet kategoriat
      const CATEGORY_DEFS = [
        {
          key: ["kuntosali", "ryhmäliikunta"],  
          label: "Kuntosali tai ryhmäliikunta"
        },
        { key: "tanssi", label: "Tanssi" },
        { key: "kamppailulajit", label: "Kamppailulajit" },
        { key: "palloilulaji", label: "Palloilulaji" },
        { key: "taiteet", label: "Taiteet" },
        { key: "muut", label: "Muut" }
      ];

      function renderCategories() {
        const container = document.getElementById("categoryButtons");
        container.innerHTML = "";

        CATEGORY_DEFS.forEach(cat => {
          let keys = Array.isArray(cat.key) ? cat.key : [cat.key];

          // Tarkista sisältääkö offers.json vähintään yhden tästä kategoriasta
          const hasOffers = allOffers.some(o => keys.includes(o.category));
          if (!hasOffers) return;

          const btn = document.createElement("button");
          btn.textContent = cat.label;
          btn.onclick = () => renderOffers(keys);
          container.appendChild(btn);
        });

        if (allOffers.length > 0) {
          const allBtn = document.createElement("button");
          allBtn.textContent = "Näytä kaikki";
          allBtn.onclick = () => renderOffers(null);
          container.appendChild(allBtn);
        }
      }

      function renderOffers(categories) {
        const container = document.getElementById("offers");
        container.innerHTML = "";

        let filtered;
        if (!categories) {
          filtered = allOffers;
        } else {
          filtered = allOffers.filter(o => categories.includes(o.category));
        }

        filtered.forEach(o => {
          const card = document.createElement("div");
          card.className = "offer-card";

          card.innerHTML = `
            <a href="${o.website}" target="_blank">${o.website}</a>
            <div class="tag">${o.category}</div>
          `;

          container.appendChild(card);
        });
      }

      fetch("/data/offers.json")
        .then(r => r.json())
        .then(data => {
          allOffers = data;
          renderCategories();
        });
    </script>

    <hr />
    <footer>
      Tiedot on koottu julkisista lähteistä tekoälyä hyödyntäen. Tarkista ajantasaiset ehdot palveluntarjoajan sivulta.
    </footer>
  </body>
</html>
