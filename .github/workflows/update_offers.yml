name: Update Offers Weekly

on:
  schedule:
    - cron: "0 7 * * 1"   # Every Monday at 07:00 UTC = 09:00 Helsinki time
  workflow_dispatch:       # <<< THIS allows you to run it manually any time

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 openai

    - name: Run update script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      run: python scripts/update_offers.py

    - name: Commit results
      run: |
        git config --global user.name "automation-bot"
        git config --global user.email "bot@example.com"
        git add data/offers.json
        git commit -m "Weekly offers update" || echo "No changes to commit"
        git push
