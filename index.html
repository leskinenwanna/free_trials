<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kokeile harrastuksia ilmaiseksi Helsingissä</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f7;
        padding: 40px;
        margin: 0;
        color: #333;
      }

      h1 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 10px;
        color: #111;
      }

      p.description {
        text-align: center;
        font-size: 16px;
        color: #555;
        margin-bottom: 30px;
      }

      /* CATEGORY BUTTONS */
      .category-buttons {
        text-align: center;
        margin-bottom: 40px;
     }

      .category-buttons button {
        background: white;
        border: 1px solid #bbb;
        padding: 10px 20px;
        margin: 6px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
      }

      .category-buttons button:hover {
        background: #e8f3ff;
        border-color: #0077dd;
      }

      .offer-container {
        max-width: 800px;
        margin: auto;
      }

      .offer-card {
        background: white;
        padding: 18px 22px;
        margin-bottom: 18px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        transition: all 0.2s ease;
      }

      .offer-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 14px rgba(0,0,0,0.12);
      }

      .offer-card a {
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        color: #0066cc;
      }

      .offer-card a:hover {
        text-decoration: underline;
      }

      .tag {
        display: inline-block;
        background: #def1ff;
        color: #005a99;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-top: 6px;
      }

      hr {
        margin-top: 50px;
        margin-bottom: 20px;
        border: none;
        border-top: 1px solid #ddd;
      }

      footer {
        text-align: center;
        font-size: 13px;
        color: #777;
      }
    </style>
  </head>

  <body>
    <h1>Kokeile harrastuksia ilmaiseksi Helsingissä</h1>
    <p class="description">
      Tämä lista päivittyy automaattisesti maanantaisin tekoälyn avulla.
    </p>

    <!-- CATEGORY BUTTONS -->
    <div class="category-buttons" id="categoryButtons"></div>

    <!-- OFFERS LIST -->
    <div class="offer-container" id="offers"></div>

    <script>
      let allOffers = [];

      function renderCategories() {
        const categories = [...new Set(allOffers.map(o => o.category))];
        const container = document.getElementById("categoryButtons");

        categories.forEach(cat => {
          const btn = document.createElement("button");
          btn.innerText = cat.charAt(0).toUpperCase() + cat.slice(1);
          btn.onclick = () => renderOffers(cat);
          container.appendChild(btn);
        });

        // Default: show all
        const btn = document.createElement("button");
        btn.innerText = "Kaikki harrastukset";
        btn.onclick = () => renderOffers(null);
        container.appendChild(btn);
      }

      function renderOffers(category) {
        const container = document.getElementById("offers");
        container.innerHTML = "";

        const filtered = category
          ? allOffers.filter(o => o.category === category)
          : allOffers;

        filtered.forEach(o => {
          const card = document.createElement('div');
          card.className = 'offer-card';

          card.innerHTML = `
            <a href="${o.website}" target="_blank">${o.website}</a>
            <div class="tag">${o.category}</div>
          `;

          container.appendChild(card);
        });
      }

      // Fetch data once at load
      fetch('/data/offers.json')
        .then(r => r.json())
        .then(data => {
          allOffers = data;
          renderCategories();
          renderOffers(null);
        });
    </script>

    <hr />
    <footer>
      Tiedot on koottu julkisista lähteistä tekoälyä hyödyntäen. Tarkista ajantasaiset ehdot palveluntarjoajan sivulta.
    </footer>
  </body>
</html>
